<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glaze Book</title>
    <meta name="description" content="Share and find glaze combinations from the studio community." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved Light/Dark choice before the first paint (see src/lib/theme.ts).
      try {
        var theme = JSON.parse(localStorage.getItem('te-glazes:theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Glaze Book" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&family=Source+Sans+3:wght@400..700&display=swap"
    />
    <!-- Material Symbols, limited to the icons listed in src/components/Icon.tsx -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_circle,add,add_a_photo,arrow_back,arrow_downward,arrow_drop_down,arrow_upward,check,close,delete,edit,error,grid_view,local_fire_department,lock,login,logout,palette,photo_library,science,search,search_off,settings,share,texture,water_drop&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
